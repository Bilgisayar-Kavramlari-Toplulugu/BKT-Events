<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .redirect-box {
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            justify-content: center;

            text-align: center;
            padding: 24px;

        .redirect-box a {

            font-weight: 600;
        }

<body data-redirect="active-event">
    <div class="redirect-box">
        <p>Aktif etkinliğe yönlendiriliyorsunuz...</p>

            Otomatik yönlendirme çalışmazsa
            <a id="manual-link" href="events/event-1.html">buraya tıklayın</a>.
        </p>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Yedek bağlantıyı da aktif etkinliğe göre güncelle
        document.getElementById("manual-link").href = "events/" + ACTIVE_EVENT;
    </script>
</body>
</html>
